[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vzrecon"
version = "6.1.6"
description = "Protocol-level proxy validator for HTTP, SOCKS4, and SOCKS5."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ghost189", email = "ghost189@vzloi.group"}]
maintainers = [{name = "VZLOI GROUP"}]
keywords = ["proxy", "socks", "socks5", "socks4", "validator", "recon", "async", "pentest", "termux"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet",
  "Topic :: System :: Networking",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://github.com/Vlad7467/vzrecon"
Source = "https://github.com/Vlad7467/vzrecon"
Issues = "https://github.com/Vlad7467/vzrecon/issues"

[project.scripts]
vzrecon = "vzrecon.cli:main"

[tool.setuptools.packages.find]
include = ["vzrecon*"]

[tool.setuptools.package-data]
vzrecon = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
